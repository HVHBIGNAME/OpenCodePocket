name: Build OCC

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '**/*.md', 'experiments/**']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'experiments/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: occ-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    name: Protocol + browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Pack zero-dependency companion
        run: |
          mkdir -p artifacts
          npm pack ./packages/bridge --pack-destination artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: release-bridge
          path: artifacts/*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
            artifacts/screenshots/

  android:
    name: Android · signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request'
    env:
      OCC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run build:web
      - run: npm run assets
      - run: npx cap sync android
      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: node scripts/ci-signing.mjs
      - name: Build native app
        working-directory: android
        run: |
          chmod +x gradlew
          keytool -list -keystore "$OCC_KEYSTORE_FILE" -storepass:env OCC_KEYSTORE_PASSWORD -alias occ
          ./gradlew assembleDebug assembleRelease lintRelease --console=plain --stacktrace
      - name: Verify APK signature and package
        run: |
          mkdir -p artifacts
          VERSION=$(node -p "require('./package.json').version")
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk "artifacts/OpenCodePocket-${VERSION}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: artifacts/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-qa
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint
          path: android/app/build/reports/lint-results-release.*

  ios:
    name: iOS · unsigned IPA
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: npm run assets
      - run: npx cap sync ios
      - name: Build arm64 iOS application
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "OCC_VERSION=$VERSION" >> "$GITHUB_ENV"
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/occ-ios" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION=1 build
      - name: Prepare IPA payload
        run: |
          mkdir -p artifacts/Payload
          cp -R "$RUNNER_TEMP/occ-ios/Build/Products/Release-iphoneos/App.app" artifacts/Payload/
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' artifacts/Payload/App.app/Info.plist
      - name: Package unsigned IPA
        working-directory: artifacts
        run: zip -qry "OpenCodePocket-${OCC_VERSION}-ios-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: release-ios-unsigned
          path: artifacts/*.ipa
          if-no-files-found: error

  release:
    name: Publish release artifacts
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - run: node scripts/checksums.mjs artifacts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
          gh release create "$RELEASE_TAG" artifacts/*.apk artifacts/*.ipa artifacts/*.tgz artifacts/SHA256SUMS.txt \
            --title "OpenCode Pocket ${RELEASE_TAG} · Within reach" --notes-file docs/releases/v1.0.0.md --verify-tag
